<!doctype html>
<html lang="en" class="h-full bg-stone-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tchat</title>
    <meta name="description" content="Mobile-first social communication application centered around intentional, temporary, human interaction." />
    <meta property="og:title" content="Tchat" />
    <meta property="og:description" content="Mobile-first social communication application centered around intentional, temporary, human interaction." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#121214" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tchat" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;450;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;450;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body class="h-full bg-stone-950 text-stone-100 antialiased selection:bg-stone-800" style="background-color:#0c0a09;color:#f5f5f4;margin:0;height:100%;">
    <div id="root" class="h-full">
      <div
        id="tchat-boot-shell"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background-color:#0c0a09;color:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;"
      >
        <div
          style="width:44px;height:44px;border-radius:14px;background-color:#1c1917;border:1px solid #292524;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:24px;color:#f5f5f4;box-shadow:0 10px 25px rgba(0,0,0,0.6);"
        >
          T
        </div>
        <div id="tchat-boot-recovery" style="display:none;margin-top:20px;max-width:280px;">
          <p style="font-size:12px;color:#a8a29e;line-height:1.5;margin:0 0 12px 0;">
            Updating application version or waiting on a slow connection.
          </p>
          <button
            type="button"
            onclick="window.__tchatHardReload && window.__tchatHardReload(true)"
            style="padding:10px 16px;border-radius:12px;background-color:#f5f5f4;color:#0c0a09;border:none;font-size:12px;font-weight:600;cursor:pointer;"
          >
            Reload Tchat
          </button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var RELOAD_KEY = 'tchat_sw_auto_recovery_ts';
        window.__tchatHardReload = function (force) {
          try {
            var last = Number(sessionStorage.getItem(RELOAD_KEY) || '0');
            if (!force && Date.now() - last < 15000) return;
            sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
          } catch (e) {}

          var tasks = [];
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
          if ('caches' in window && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }
          Promise.all(tasks).finally(function () {
            var url = new URL(window.location.href);
            url.searchParams.set('_v', String(Date.now()));
            window.location.replace(url.toString());
          });
        };

        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault();
          window.__tchatHardReload(false);
        });

        window.addEventListener(
          'error',
          function (event) {
            var t = event && event.target;
            if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('/assets/') !== -1 && !window.__TCHAT_MOUNTED__) {
              window.__tchatHardReload(false);
            }
          },
          true
        );

        setTimeout(function () {
          if (!window.__TCHAT_MOUNTED__) {
            var el = document.getElementById('tchat-boot-recovery');
            if (el) el.style.display = 'block';
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
